<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Line Distribution</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#e9e9e7">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="card">
  <div class="toprow">
    <button id="libBtn" class="songbtn" title="Songs">
      <span class="songtext"><b id="songTitle"></b><span id="songArtist"></span></span>
      <svg viewBox="0 0 12 8" width="12" height="8"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="tools">
      <button id="rateBtn" class="icon txt" title="Playback speed">1×</button>
      <button id="countBtn" class="icon txt" title="Count-in">3·2·1</button>
      <button id="lanesBtn" class="icon" title="Segment lanes"><svg viewBox="0 0 20 20" width="18" height="18"><rect x="1" y="4" width="8" height="4" rx="2" fill="currentColor"/><rect x="11" y="4" width="5" height="4" rx="2" fill="currentColor"/><rect x="4" y="12" width="6" height="4" rx="2" fill="currentColor"/><rect x="12" y="12" width="7" height="4" rx="2" fill="currentColor"/></svg></button>
      <button id="distBtn" class="icon" title="Distribution"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M9 3 A 8 8 0 1 0 17.6 11.5 L 9 10.5 Z" fill="currentColor"/><path d="M11 2 a8 8 0 0 1 7.5 7 l-7.5 -.6z" fill="currentColor"/></svg></button>
      <button id="undoBtn" class="icon" title="Undo">↩</button>
      <button id="redoBtn" class="icon" title="Redo">↪</button>
      <button id="gearBtn" class="icon" title="Settings">⚙</button>
    </div>
    <label class="switch"><span>Playback<br>Mode</span><input type="checkbox" id="modeToggle"><i></i></label>
  </div>
  <div class="transport">
    <button id="playBtn" class="playbtn" title="Play / pause"></button>
    <div id="timeline" class="timeline">
      <div class="tl-heads"></div>
      <div class="tl-wrap">
        <canvas></canvas>
        <div class="tl-unplayed"></div>
        <div class="tl-playhead"></div>
      </div>
    </div>
    <div class="timecol">
      <div id="timeLabel">0:00 / 0:00</div>
      <button id="aiChip" class="aichip" hidden></button>
    </div>
  </div>
</header>

<h1 id="headline"></h1>
<main id="list"></main>
<div id="toast"></div>
<div id="countOverlay"></div>

<footer id="bottom">
  <div id="holdBar">
    <div id="controls">
      <div id="nowStrip"></div>
      <div class="ctlbtns">
        <button id="back3Btn" class="sidebtn" title="Back 3 seconds">↺3s</button>
        <button id="dockPlay" class="playbtn" title="Play / pause"></button>
        <button id="retakeBtn" class="sidebtn" title="Undo and replay from there">↩</button>
      </div>
      <div id="dockTime"></div>
    </div>
    <div id="holdCircles"></div>
  </div>
</footer>
<div id="segChip"><span></span><button class="pillbtn danger" id="segDelBtn">Delete</button></div>

<dialog id="distDlg">
  <h2>Distribution</h2>
  <div id="distBody"></div>
  <div class="dlgbtns"><button class="pillbtn" id="distClose">Close</button></div>
</dialog>

<dialog id="libDlg">
  <h2>Songs</h2>
  <div id="libList"></div>
  <h3>New song</h3>
  <form id="newForm">
    <div class="field"><span>Group</span><input type="text" id="newGroup" list="groupList" required><datalist id="groupList"></datalist></div>
    <div class="field"><span>Song title</span><input type="text" id="newTitle" required></div>
    <div class="field"><span>Artist</span><input type="text" id="newArtist"></div>
    <div class="dlgbtns">
      <button class="pillbtn primary" type="submit">Create</button>
      <button class="pillbtn" type="button" id="importBtn">Import JSON</button>
      <button class="pillbtn" type="button" id="libClose">Close</button>
    </div>
  </form>
</dialog>

<dialog id="setDlg">
  <h2>Settings</h2>
  <div class="field"><span>Group</span><input type="text" id="setGroup"></div>
  <div class="field"><span>Song title</span><input type="text" id="setTitle"></div>
  <div class="field"><span>Artist</span><input type="text" id="setArtist"></div>
  <div class="field"><span>Length</span><input type="text" id="setDur" placeholder="3:00"></div>
  <div class="field"><span>Audio</span><button class="pillbtn" id="loadAudioBtn">Load audio file…</button><em id="audioName"></em></div>
  <h3>Members</h3>
  <div id="memberEditor"></div>
  <button class="pillbtn" id="addMemberBtn">+ Add member</button>
  <h3>Data</h3>
  <div class="dlgbtns">
    <button class="pillbtn" id="exportBtn">Export JSON</button>
    <button class="pillbtn danger" id="clearBtn">Clear all timings</button>
  </div>
  <div class="dlgbtns"><button class="pillbtn primary" id="setClose">Done</button></div>
</dialog>

<input type="file" id="audioFile" accept="audio/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="avatarFile" accept="image/*" hidden>
<audio id="audio" hidden></audio>

<script type="module" src="js/main.js"></script>
</body>
</html>
