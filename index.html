<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Line Distribution</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#e9e9e7">
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/timeline.js">
<link rel="modulepreload" href="js/clock.js">
<link rel="modulepreload" href="js/db.js">
</head>
<body>

<header class="card">
  <div class="toprow">
    <button id="songLabel" title="Song library"></button>
    <div class="tools">
      <button id="countBtn" class="icon countbtn" title="Count-in: 3 beats before play starts">3·2·1</button>
      <button id="rateBtn" class="icon countbtn" title="Playback speed">1×</button>
      <button id="detailBtn" class="icon" title="Show segments (D)"><svg viewBox="0 0 20 20" width="18" height="18"><rect x="1" y="8" width="8" height="4.5" rx="2.2" fill="currentColor"/><rect x="10.5" y="8" width="5" height="4.5" rx="2.2" fill="currentColor"/><rect x="17" y="8" width="2.5" height="4.5" rx="1.2" fill="currentColor"/></svg></button>
      <button id="distBtn" class="icon" title="Distribution"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M9 3 A 8 8 0 1 0 17.6 11.5 L 9 10.5 Z" fill="currentColor"/><path d="M11 2 a8 8 0 0 1 7.5 7 l-7.5 -.6z" fill="currentColor"/></svg></button>
      <button id="undoBtn" class="icon" title="Undo (Z)">↩</button>
      <button id="libBtn" class="icon" title="Song library"><svg viewBox="0 0 20 20" width="18" height="18"><rect x="2" y="3" width="16" height="3" rx="1.5" fill="currentColor"/><rect x="2" y="8.5" width="16" height="3" rx="1.5" fill="currentColor"/><rect x="2" y="14" width="10" height="3" rx="1.5" fill="currentColor"/></svg></button>
      <button id="gearBtn" class="icon" title="Settings">⚙</button>
    </div>
    <label class="switch"><span>Playback<br>Mode</span><input type="checkbox" id="modeToggle"><i></i></label>
  </div>
  <div class="transport">
    <button id="playBtn" class="playbtn" title="Play / pause (Space)">▶</button>
    <button id="back3Btn" class="sidebtn" title="Back 3 seconds (←)">↺3s</button>
    <div id="tl" title="Tap or drag to seek">
      <canvas id="tlCanvas"></canvas>
      <div id="tlHead"></div>
    </div>
    <div id="timeLabel">0:00 / 3:00</div>
  </div>
</header>

<h1 id="headline"></h1>
<div id="audioHint" hidden><button class="pillbtn" id="audioHintBtn">♪ Load the song's audio</button></div>
<main id="list"></main>

<footer id="bottom">
  <div id="holdCircles"></div>
</footer>

<div id="toast"></div>
<div id="countOverlay"></div>
<div id="segChip"><span></span><button class="pillbtn danger" id="segDelBtn">Delete</button></div>
<div id="dropHint">Drop an audio file or .linedist.json</div>

<dialog id="distDlg">
  <h2 tabindex="-1" autofocus>Distribution</h2>
  <div id="distBody"></div>
  <div class="dlgbtns">
    <button class="pillbtn" id="distCopy">Copy as text</button>
    <button class="pillbtn primary" id="distClose">Close</button>
  </div>
</dialog>

<dialog id="libDlg">
  <h2 tabindex="-1" autofocus>Songs</h2>
  <div id="libList"></div>
  <h3>New song</h3>
  <div class="field"><span>Members</span><select id="newRoster"></select></div>
  <div class="field"><span>Song title</span><input type="text" id="newTitle" placeholder="Title"></div>
  <div class="field"><span>Artist</span><input type="text" id="newArtist" placeholder="Original artist"></div>
  <div class="dlgbtns">
    <button class="pillbtn primary" id="newCreate">Create song</button>
    <button class="pillbtn" id="libImport">Import .linedist.json…</button>
    <button class="pillbtn" id="libClose">Close</button>
  </div>
</dialog>

<dialog id="setDlg">
  <h2 tabindex="-1" autofocus>Settings</h2>
  <div class="field"><span>Group</span><input type="text" id="setGroup"></div>
  <div class="field"><span>Song title</span><input type="text" id="setTitle"></div>
  <div class="field"><span>Artist</span><input type="text" id="setArtist"></div>
  <div class="field"><span>Length</span><input type="text" id="setDur" placeholder="3:00"></div>
  <div class="field audiofield"><span>Audio</span><div><button class="pillbtn" id="loadAudioBtn">Load audio…</button><em id="audioName"></em></div></div>
  <div class="field"><span>Snap</span><label class="checklabel"><input type="checkbox" id="setSnap"><span>Nudge presses onto the nearest beat or vocal entrance (needs audio)</span></label></div>
  <h3>Members</h3>
  <div id="memberEditor"></div>
  <button class="pillbtn" id="addMemberBtn">+ Add member</button>
  <h3>Data</h3>
  <div class="dlgbtns">
    <button class="pillbtn" id="exportBtn">Export JSON</button>
    <button class="pillbtn danger" id="clearBtn">Clear all timings</button>
  </div>
  <p class="keys">Keyboard: <b>Space</b> play/pause · hold <b>1–9</b> for members · <b>←/→</b> 3s · <b>Z</b> undo · <b>Shift+Z</b> redo · <b>D</b> segments</p>
  <div class="dlgbtns"><button class="pillbtn primary" id="setClose">Done</button></div>
</dialog>

<input type="file" id="audioFile" accept="audio/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" multiple hidden>
<input type="file" id="avatarFile" accept="image/*" hidden>
<audio id="audio" preload="auto" hidden></audio>

<script type="module" src="js/app.js"></script>
</body>
</html>
